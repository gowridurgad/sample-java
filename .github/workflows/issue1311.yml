name: Replicate setup-node static Node.js issue

on:
  workflow_dispatch:

jobs:
  test-static-node:
    runs-on: ubuntu-latest
    container:
      image: gcr.io/kaniko-project/executor:debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run node -v
        run: node -v
