name: Reproduce setup-node failure

on:
  workflow_dispatch:

jobs:
  reproduce-failure:
    runs-on: self-hosted
    container:
      image: gcr.io/kaniko-project/executor:debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Node.js 
        run: node -v
