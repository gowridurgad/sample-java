name: Toolchains Overgrowth Test

on: [workflow_dispatch]

jobs:
  test-toolchains-duplication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (first)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Print toolchains.xml (after first run)
        run: cat ~/.m2/toolchains.xml || echo "Not found"

      - name: Set up Java (second run)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Print toolchains.xml (after second run)
        run: cat ~/.m2/toolchains.xml || echo "Not found"
