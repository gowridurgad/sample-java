name: testing-1008

on:
  workflow_dispatch:

jobs:
  test-main-file:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: sproctor/setup-java@main
        with:
          distribution: "jetbrains"
          java-version-file: ".tool-versions"

  test-main-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java
        uses: sproctor/setup-java@main
        with:
          distribution: "jetbrains"
          java-version: "17.0.8.1+1080.1"

  test-v5-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version: "17.0.8.1+1080.1"

  test-v5-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: "jetbrains"
          java-version-file: ".tool-versions"
