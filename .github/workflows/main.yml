name: Java Multiple JDK Demo

on:
  workflow_dispatch:
    
    
jobs:
  build:
    runs-on: ubuntu-latest
    
        
    name: Setup Java 
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup java
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9
        with:
          distribution: 'temurin'
          java-version: '17' 
          cache: "maven"
          
         
      - name: Build with Maven
        run: mvn clean install

